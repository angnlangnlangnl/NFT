<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LuckyStamp - 奖励分配</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; }
        .container { max-width: 500px; margin: 0 auto; padding: 20px; }
        
        .header { text-align: center; padding: 30px 0; }
        .header h1 { font-size: 28px; color: #ffd700; }
        .header p { color: #888; margin-top: 5px; }
        
        .card { background: #16213e; border-radius: 16px; padding: 20px; margin-bottom: 16px; }
        .card-title { font-size: 16px; color: #ffd700; margin-bottom: 15px; }
        
        .info-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #222; }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: #888; }
        .info-value { color: #fff; font-weight: bold; }
        
        .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; transition: all 0.3s; }
        .btn-primary { background: #ffd700; color: #1a1a2e; }
        .btn-secondary { background: #0f3460; color: #ffd700; }
        .btn-danger { background: #e74c3c; color: #fff; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn:hover:not(:disabled) { transform: scale(1.02); }
        
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; color: #888; margin-bottom: 5px; font-size: 14px; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #333; border-radius: 8px; background: #1a1a2e; color: #fff; font-size: 16px; }
        .input-group input:focus { outline: none; border-color: #ffd700; }
        
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { flex: 1; padding: 12px; text-align: center; background: #16213e; border-radius: 10px; cursor: pointer; color: #888; font-weight: bold; }
        .tab.active { background: #ffd700; color: #1a1a2e; }
        
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 12px 24px; border-radius: 8px; color: #fff; font-weight: bold; z-index: 1000; }
        .toast-success { background: #27ae60; }
        .toast-error { background: #e74c3c; }
        .toast-info { background: #2980b9; }
        
        .loading { text-align: center; padding: 20px; color: #888; }
        .address-list { max-height: 250px; overflow-y: auto; }
        .address-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #1a1a2e; border-radius: 8px; margin-bottom: 8px; }
        .address-item .addr { font-size: 11px; color: #888; word-break: break-all; flex: 1; }
        .address-item .remove-btn { background: #e74c3c; color: #fff; border: none; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
        
        .badge { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: bold; }
        .badge-owner { background: #ffd700; color: #1a1a2e; }
        .badge-member { background: #27ae60; color: #fff; }
        .badge-visitor { background: #888; color: #fff; }
        
        .access-denied { text-align: center; padding: 40px 20px; }
        .access-denied .icon { font-size: 60px; margin-bottom: 20px; }
        .access-denied p { color: #888; margin-top: 10px; }
        
        .share-section { background: #0f3460; border-radius: 12px; padding: 20px; margin-bottom: 16px; text-align: center; }
        .share-section .big-number { font-size: 36px; color: #ffd700; font-weight: bold; }
        .share-section .label { color: #888; font-size: 14px; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏆 奖励分配</h1>
            <p>RewardDistributor</p>
        </div>

        <div id="wallet-section">
            <button class="btn btn-primary" id="connect-btn" onclick="connectWallet()">连接钱包</button>
        </div>

        <div id="main-section" style="display:none;">
            <!-- 身份标识 -->
            <div id="role-badge" style="text-align:center; margin-bottom:16px;"></div>

            <!-- 公开统计（所有人可见） -->
            <div class="card">
                <div class="card-title">📊 奖励池概览</div>
                <div class="info-row"><span class="info-label">USDT余额</span><span class="info-value" id="usdt-balance">0</span></div>
                <div class="info-row"><span class="info-label">BNB余额</span><span class="info-value" id="bnb-balance">0</span></div>
                <div class="info-row"><span class="info-label">奖励地址数</span><span class="info-value" id="addr-count">0</span></div>
                <div class="info-row"><span class="info-label">累计分配USDT</span><span class="info-value" id="total-usdt">0</span></div>
                <div class="info-row"><span class="info-label">累计分配BNB</span><span class="info-value" id="total-bnb">0</span></div>
                <div class="info-row"><span class="info-label">分配次数</span><span class="info-value" id="dist-count">0</span></div>
            </div>

            <!-- 你的份额（仅成员可见） -->
            <div id="member-share" class="share-section" style="display:none;">
                <div class="label">🔥 你的预估份额</div>
                <div class="big-number" id="share-usdt">0 USDT</div>
                <div style="margin-top:10px; color:#888;" id="share-bnb">0 BNB</div>
            </div>

            <!-- Owner/成员操作面板 -->
            <div id="owner-panel" style="display:none;">
                <div class="tabs">
                    <div class="tab active" onclick="switchTab('distribute')">💰 分配</div>
                    <div class="tab" onclick="switchTab('withdraw')">💸 提现</div>
                    <div class="tab" onclick="switchTab('manage')">👥 管理</div>
                </div>

                <div class="card" id="tab-distribute">
                    <div class="card-title">💰 奖励分配</div>
                    <button class="btn btn-primary" onclick="distributeUSDT()">🎯 分配USDT</button>
                    <button class="btn btn-secondary" onclick="distributeBNB()">💎 分配BNB</button>
                    <button class="btn btn-primary" onclick="distributeAll()">🚀 一键分配</button>
                </div>

                <div class="card" id="tab-withdraw" style="display:none;">
                    <div class="card-title">💸 紧急提现</div>
                    <div class="input-group">
                        <label>USDT数量</label>
                        <input type="number" id="withdraw-usdt" placeholder="0.00" step="0.01">
                    </div>
                    <button class="btn btn-danger" onclick="withdrawUSDT()">提现USDT</button>
                    <div class="input-group" style="margin-top:15px;">
                        <label>BNB数量</label>
                        <input type="number" id="withdraw-bnb" placeholder="0.00" step="0.01">
                    </div>
                    <button class="btn btn-danger" onclick="withdrawBNB()">提现BNB</button>
                </div>

                <div class="card" id="tab-manage" style="display:none;">
                    <div class="card-title">👥 地址管理</div>
                    <div class="input-group">
                        <label>添加地址</label>
                        <input type="text" id="add-addr" placeholder="0x...">
                    </div>
                    <button class="btn btn-primary" onclick="addAddress()">➕ 添加</button>
                    <div class="input-group" style="margin-top:15px;">
                        <label>批量添加（逗号分隔）</label>
                        <input type="text" id="add-addrs" placeholder="0x..., 0x...">
                    </div>
                    <button class="btn btn-primary" onclick="addAddresses()">➕ 批量添加</button>
                    <div style="margin-top:20px; color:#ffd700; font-weight:bold;">📋 奖励地址列表</div>
                    <div class="address-list" id="address-list">加载中...</div>
                </div>
            </div>

            <!-- 无权限提示 -->
            <div id="visitor-view" class="access-denied">
                <div class="icon">🔒</div>
                <p>仅奖励成员可操作</p>
                <p style="font-size:12px;">你的地址不在奖励列表中</p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script>
        const CONTRACT_ADDRESS = '0x4b5Ef18cA0fAC340A7d6E7d692aA39883d52fDcd';
        const CONTRACT_ABI = [
            "function getBalances() view returns (uint256 usdt, uint256 bnb)",
            "function getAddressCount() view returns (uint256)",
            "function getStats() view returns (uint256 addrCount, uint256 usdtTotal, uint256 bnbTotal, uint256 distCount, uint256 usdtBal, uint256 bnbBal)",
            "function getAddresses() view returns (address[])",
            "function isRewardAddress(address) view returns (bool)",
            "function owner() view returns (address)",
            "function distributeUSDT() external",
            "function distributeBNB() external",
            "function distributeAll() external",
            "function withdrawUSDT(uint256) external",
            "function withdrawBNB(uint256) external",
            "function addAddress(address) external",
            "function addAddresses(address[]) external",
            "function paused() view returns (bool)"
        ];

        let provider, signer, contract, userAddress, isOwner = false, isMember = false;

        async function connectWallet() {
            try {
                if (!window.ethereum) return showToast('请安装MetaMask', 'error');
                await window.ethereum.request({ method: 'eth_requestAccounts' });
                provider = new ethers.providers.Web3Provider(window.ethereum);
                signer = provider.getSigner();
                contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);
                userAddress = await signer.getAddress();

                const ownerAddr = await contract.owner();
                isOwner = userAddress.toLowerCase() === ownerAddr.toLowerCase();
                isMember = await contract.isRewardAddress(userAddress);

                document.getElementById('wallet-section').innerHTML = `
                    <div class="card" style="text-align:center;">
                        <p style="color:#888;font-size:12px;word-break:break-all;">${userAddress}</p>
                    </div>`;
                document.getElementById('main-section').style.display = 'block';

                updateRoleBadge();
                await refreshAll();

                window.ethereum.on('accountsChanged', () => location.reload());
                window.ethereum.on('chainChanged', () => location.reload());
            } catch (e) {
                showToast('连接失败: ' + e.message, 'error');
            }
        }

        function updateRoleBadge() {
            let badge = '';
            if (isOwner) badge = '<span class="badge badge-owner">👑 Owner</span>';
            else if (isMember) badge = '<span class="badge badge-member">⭐ 奖励成员</span>';
            else badge = '<span class="badge badge-visitor">👤 访客</span>';
            document.getElementById('role-badge').innerHTML = badge;

            document.getElementById('owner-panel').style.display = (isOwner || isMember) ? 'block' : 'none';
            document.getElementById('visitor-view').style.display = (isOwner || isMember) ? 'none' : 'block';
        }

        async function refreshAll() {
            try {
                const stats = await contract.getStats();
                document.getElementById('usdt-balance').textContent = parseFloat(ethers.utils.formatUnits(stats.usdtBal, 18)).toFixed(4) + ' USDT';
                document.getElementById('bnb-balance').textContent = parseFloat(ethers.utils.formatEther(stats.bnbBal)).toFixed(4) + ' BNB';
                document.getElementById('addr-count').textContent = stats.addrCount.toString();
                document.getElementById('total-usdt').textContent = parseFloat(ethers.utils.formatUnits(stats.usdtTotal, 18)).toFixed(4) + ' USDT';
                document.getElementById('total-bnb').textContent = parseFloat(ethers.utils.formatEther(stats.bnbTotal)).toFixed(4) + ' BNB';
                document.getElementById('dist-count').textContent = stats.distCount.toString();

                // 成员显示个人份额
                if (isMember && stats.addrCount > 0) {
                    const perUsdt = stats.usdtBal.div(stats.addrCount);
                    const perBnb = stats.bnbBal.div(stats.addrCount);
                    document.getElementById('member-share').style.display = 'block';
                    document.getElementById('share-usdt').textContent = parseFloat(ethers.utils.formatUnits(perUsdt, 18)).toFixed(4) + ' USDT';
                    document.getElementById('share-bnb').textContent = parseFloat(ethers.utils.formatEther(perBnb)).toFixed(4) + ' BNB';
                } else if (isMember) {
                    document.getElementById('member-share').style.display = 'block';
                    document.getElementById('share-usdt').textContent = '0 USDT';
                    document.getElementById('share-bnb').textContent = '0 BNB';
                } else {
                    document.getElementById('member-share').style.display = 'none';
                }

                if (isOwner || isMember) await loadAddresses();
            } catch (e) { console.error(e); }
        }

        async function loadAddresses() {
            try {
                const addrs = await contract.getAddresses();
                const list = document.getElementById('address-list');
                if (addrs.length === 0) { list.innerHTML = '<div class="loading">暂无地址</div>'; return; }
                list.innerHTML = addrs.map((a, i) => `
                    <div class="address-item">
                        <span style="color:#ffd700;margin-right:8px;">#${i+1}</span>
                        <span class="addr">${a}</span>
                        ${isOwner ? `<button class="remove-btn" onclick="removeAddr('${a}')">移除</button>` : ''}
                    </div>
                `).join('');
            } catch (e) { document.getElementById('address-list').innerHTML = '<div class="loading">加载失败</div>'; }
        }

        async function removeAddr(addr) {
            try {
                const tx = await contract.removeAddress(addr);
                await tx.wait();
                showToast('已移除', 'success');
                await refreshAll();
            } catch (e) { showToast('失败: ' + e.message, 'error'); }
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('tab-distribute').style.display = tab === 'distribute' ? 'block' : 'none';
            document.getElementById('tab-withdraw').style.display = tab === 'withdraw' ? 'block' : 'none';
            document.getElementById('tab-manage').style.display = tab === 'manage' ? 'block' : 'none';
        }

        async function distributeUSDT() {
            try { const tx = await contract.distributeUSDT(); await tx.wait(); showToast('USDT分配成功', 'success'); await refreshAll(); } catch (e) { showToast(e.message, 'error'); }
        }
        async function distributeBNB() {
            try { const tx = await contract.distributeBNB(); await tx.wait(); showToast('BNB分配成功', 'success'); await refreshAll(); } catch (e) { showToast(e.message, 'error'); }
        }
        async function distributeAll() {
            try { const tx = await contract.distributeAll(); await tx.wait(); showToast('一键分配成功', 'success'); await refreshAll(); } catch (e) { showToast(e.message, 'error'); }
        }

        async function withdrawUSDT() {
            try {
                const v = document.getElementById('withdraw-usdt').value;
                if (!v || parseFloat(v) <= 0) return showToast('输入金额', 'error');
                const tx = await contract.withdrawUSDT(ethers.utils.parseUnits(v, 18));
                await tx.wait(); showToast('提现成功', 'success'); await refreshAll();
            } catch (e) { showToast(e.message, 'error'); }
        }
        async function withdrawBNB() {
            try {
                const v = document.getElementById('withdraw-bnb').value;
                if (!v || parseFloat(v) <= 0) return showToast('输入金额', 'error');
                const tx = await contract.withdrawBNB(ethers.utils.parseEther(v));
                await tx.wait(); showToast('提现成功', 'success'); await refreshAll();
            } catch (e) { showToast(e.message, 'error'); }
        }

        async function addAddress() {
            try {
                const a = document.getElementById('add-addr').value.trim();
                if (!ethers.utils.isAddress(a)) return showToast('无效地址', 'error');
                const tx = await contract.addAddress(a);
                await tx.wait(); showToast('添加成功', 'success'); document.getElementById('add-addr').value = ''; await refreshAll();
            } catch (e) { showToast(e.message, 'error'); }
        }
        async function addAddresses() {
            try {
                const input = document.getElementById('add-addrs').value.trim();
                const arr = input.split(',').map(a => a.trim()).filter(a => ethers.utils.isAddress(a));
                if (arr.length === 0) return showToast('无效地址', 'error');
                const tx = await contract.addAddresses(arr);
                await tx.wait(); showToast(`${arr.length}个地址添加成功`, 'success'); document.getElementById('add-addrs').value = ''; await refreshAll();
            } catch (e) { showToast(e.message, 'error'); }
        }

        function showToast(msg, type) {
            const t = document.createElement('div'); t.className = `toast toast-${type}`; t.textContent = msg;
            document.body.appendChild(t); setTimeout(() => t.remove(), 3000);
        }
    </script>
</body>
</html>
