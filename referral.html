<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>邀请</title>
    <style>
        /* 重置样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            /* 背景图设置在 body 上，实现全局固定 */
            background-image: url('images/邀请背景.png');
            background-repeat: no-repeat;
            background-position: center top;
            background-size: cover;
            background-attachment: fixed; /* 关键：背景图固定不随页面滚动 */
            background-color: #0b0b2a; /* 兜底颜色 */
            
            display: flex;
            justify-content: center;
            align-items: flex-start; /* 改为顶部对齐，方便长页面滑动体验 */
            min-height: 100vh;
            padding-top: 20px; /* 顶部留点空隙 */
            padding-bottom: 130px; /* 增加底部内边距，防止内容被固定导航栏遮挡 */
        }

        /* 模拟手机屏幕容器 */
        .mobile-container {
            width: 100%;
            max-width: 420px;
            background: transparent; /* 背景设为透明，露出底部的 body 背景 */
            
            position: relative;
            padding-bottom: 0px; /* 移除了原来的底部留白，交由 body 统一管理 */
            overflow-x: hidden; /* 隐藏水平滚动条 */
            color: #fff;
            margin: 0 15px; /* 左右留边距 */
        }

        /* ========== 修改点：邀请页顶部导航栏 ========== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 500px;
            margin: 0 auto 15px;
            padding: 0 5px;
        }
        .header i { 
            font-size: 24px; 
            color: #e0d4ff; /* 参考产品页的淡紫色图标颜色 */
            cursor: pointer; 
            transition: 0.3s; 
        }
        .header i:hover { color: #fff; }
        .header h1 {
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(180deg, #ffeeba 0%, #ffd700 50%, #e6b800 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            letter-spacing: 4px;
        }

        /* ========== 修改点：副标题参考产品页样式 ========== */
        .hero-title {
            text-align: center;
            font-size: 13px; 
            color: #c8b6ff; /* 参考颜色 */
            margin-bottom: 25px;
            letter-spacing: 2px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }
        .hero-title::before, .hero-title::after {
            content: "";
            display: inline-block;
            width: 30px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #c8b6ff);
        }
        .hero-title::after { background: linear-gradient(270deg, transparent, #c8b6ff); }
        /* ============================================ */

        /* 二维码扫码区 */
        .qr-section {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
        }
        .qr-box {
            border: 1px solid #7958a6;
            border-radius: 10px;
            padding: 15px 20px;
            background: rgba(30, 15, 60, 0.4);
            text-align: center;
            position: relative;
            width: 75%;
        }
        .qr-code-placeholder {
            width: 100px;
            height: 100px;
            background: #fff;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            color: #000;
            font-size: 12px;
        }
        .qr-box h2 {
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 3px;
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }
        .qr-box p {
            font-size: 11px;
            color: #d1bceb;
        }

        /* 顶部三个数据卡片 */
        .top-stats {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 0 15px;
            margin-bottom: 20px;
        }
        .stat-card-small {
            background: rgba(50, 30, 100, 0.6);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 8px;
            padding: 12px 5px;
            text-align: center;
            flex: 1;
            box-shadow: 0 0 15px rgba(100, 50, 255, 0.3) inset;
        }
        .stat-card-small .label {
            font-size: 12px;
            color: #dcc586;
            margin-bottom: 5px;
        }
        .stat-card-small .value {
            font-size: 22px;
            font-weight: bold;
            color: #fff;
        }

        /* 移除中间两张卡片后的空白间距 */
        .spacer {
            height: 20px;
        }

        /* 规则区 */
        .rules-section {
            padding: 0 15px;
            margin-bottom: 20px;
        }
        .rules-box {
            border: 1px solid #7958a6;
            border-radius: 10px;
            padding: 15px;
            background: rgba(30, 15, 60, 0.4);
            text-align: center;
            position: relative;
        }
        .rules-box .title {
            color: #ecd17d;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }
        .rules-box .title::before, .rules-box .title::after {
            content: ">>>";
            font-size: 10px;
            color: #cba766;
        }
        .rules-box .title::after { content: "<<<"; }
        .rules-box p {
            font-size: 13px;
            line-height: 1.6;
            color: #f0e6ff;
        }

        /* 邀请记录 */
        .record-section {
            padding: 0 15px;
            margin-bottom: 20px; 
        }
        .record-title {
            color: #ecd17d;
            font-size: 15px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }
        .record-title::before, .record-title::after {
            content: ">>>";
            font-size: 10px;
            color: #cba766;
        }
        .record-title::after { content: "<<<"; }
        
        /* 记录卡片使用参考按钮的渐变和边框颜色 */
        .record-item {
            background: linear-gradient(to right, #683beb, #a25bfb);
            border: 1px solid #fce38a;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 15px rgba(80, 50, 200, 0.3);
        }
        .record-info {
            display: flex;
            flex-direction: column;
        }
        .record-info .addr {
            font-size: 14px;
            color: #fff;
            font-family: monospace;
        }
        .record-info .time {
            font-size: 10px;
            color: #d1bceb;
            margin-top: 3px;
        }
        .record-status {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }
        .record-status .role {
            font-size: 12px;
            color: #fff;
        }

        /* ==================== 固定导航栏样式 ==================== */
        .nav-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 110px; /* 固定高度 */
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 10px 10px 15px 10px; /* 底部增加 padding 适配全面屏手机 */
            
            /* 背景改为完全透明，移除模糊效果 */
            background: transparent;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            box-shadow: none;
            
            z-index: 100; /* 确保浮在最上层 */
            pointer-events: none;
        }
        .nav-container .nav-item {
            pointer-events: auto;
        }

        .nav-item {
            position: relative;
            width: 68px;
            height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #7448cc, #4a1d9b);
            border: 2px solid rgba(255, 215, 0, 0.4);
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.15), 0 0 20px rgba(112, 48, 210, 0.8);
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            clip-path: polygon(15% 0, 85% 0, 100% 15%, 100% 85%, 85% 100%, 15% 100%, 0 85%, 0 15%);
        }
        .nav-item.center {
            width: 84px;
            height: 98px;
            z-index: 2;
            border-color: rgba(255, 215, 0, 0.8);
            box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.2), 0 0 30px rgba(255, 215, 0, 0.3);
        }
        .nav-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
        }
        .nav-item .icon-wrap {
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 4px;
        }
        .nav-item .icon-wrap svg {
            width: 32px;
            height: 32px;
            fill: #f9d976;
            filter: drop-shadow(0 0 5px rgba(255, 215, 0, 0.5));
        }
        .nav-item.center .icon-wrap svg {
            width: 40px;
            height: 40px;
        }
        .nav-item .label {
            font-size: 13px;
            font-weight: 500;
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255,255,255,0.2);
            letter-spacing: 1px;
        }
        .nav-item.center .label {
            font-size: 15px;
            font-weight: bold;
        }
        .nav-item::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 15%;
            width: 70%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.8), transparent);
            border-radius: 50%;
            opacity: 0.6;
        }

        /* 移动端窄屏适配 */
        @media (max-width: 400px) {
            .nav-item { width: 56px; height: 68px; }
            .nav-item.center { width: 72px; height: 84px; }
            .nav-item .icon-wrap svg { width: 26px; height: 26px; }
            .nav-item.center .icon-wrap svg { width: 34px; height: 34px; }
            .nav-item .label { font-size: 11px; }
            .nav-container { gap: 8px; padding: 10px 5px 15px 5px; }
        }

        /* 水印 */
        .watermark {
            position: absolute;
            bottom: 10px;
            right: 15px;
            font-size: 10px;
            color: rgba(255,255,255,0.1);
            z-index: 1;
        }

    </style>
</head>
