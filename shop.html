<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品选购</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- 基础重置 --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-image: url('images/产品选购背景.png');
            background-size: cover;
            background-position: center center; 
            background-repeat: no-repeat;
            background-attachment: fixed;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            color: #ffffff;
            min-height: 100vh;
            padding: 20px 15px 50px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        /* 顶部导航栏 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            width: 100%;
            max-width: 500px;
            margin-top: 10px;
            padding: 0 5px;
        }
        .header i { font-size: 24px; color: #e0d4ff; cursor: pointer; transition: 0.3s; }
        .header i:hover { color: #fff; }

        /* --- 主标题 --- */
        .main-title {
            font-family: "Times New Roman", "Songti SC", Georgia, serif;
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 4px;
            text-align: center;
            margin-bottom: 5px;
            margin-top: -10px;
            background: linear-gradient(180deg, #fffdf5 0%, #ffeaa3 40%, #ffd700 70%, #d4af37 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
            z-index: 2;
        }

        /* --- 副标题 --- */
        .subtitle {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            font-size: 13px;
            color: #ccbfff;
            letter-spacing: 2px;
            margin-bottom: 30px;
            z-index: 2;
        }
        .subtitle::before, .subtitle::after {
            content: "";
            display: inline-block;
            width: 30px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.5));
        }
        .subtitle::after { background: linear-gradient(270deg, transparent, rgba(255, 215, 0, 0.5)); }

        /* --- 商品卡片容器 --- */
        .product-container {
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
            z-index: 2;
        }

        /* ====================================================
           通用卡片：全图铺满、无文字、点击整图触发购买
           ==================================================== */
        .card-full-image {
            position: relative;
            background: transparent; 
            border: none; 
            padding: 0; 
            box-shadow: none !important;
            min-height: 160px; 
            cursor: pointer; 
            border-radius: 16px;
            overflow: hidden;
        }
        
        .card-full-image::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-size: contain; 
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 16px;
            z-index: 0;
        }
        
        /* --- 图片背景映射 --- */
        .card-money-tree::before {
            background-image: url('images/金钱树1.png');
        }
        .card-baobao::before {
            background-image: url('images/聚宝盆1.png');
        }
        /* 【新增】百宝箱：按照您的指令，暂时使用聚宝盆的图 */
        .card-baoxiang::before {
            background-image: url('images/聚宝盆1.png');
        }

        /* 隐藏内部占位元素 */
        .card-full-image .product-icon,
        .card-full-image .product-info,
        .card-full-image .product-action {
            display: none; 
        }

        /* 移动端适配 - 纯图卡片高度变小 */
        @media (max-width: 600px) {
            .main-title { font-size: 32px; }
            .header { margin-top: 5px; }
            .subtitle { font-size: 12px; gap: 10px; }
            .card-full-image { min-height: 120px; } 
        }
    </style>
</head>
<body>
    <header class="header">
        <i class="fas fa-chevron-left"></i>
        <i class="fas fa-times"></i>
    </header>

    <div class="main-title">产品选购</div>
    <div class="subtitle">选择财富道具，开启金币收益</div>

    <!-- 商品列表 -->
    <div class="product-container">
        
        <!-- ===================================== -->
        <!-- 卡片 1: 金钱树 (点击触发 10 USDT) -->
        <!-- ===================================== -->
        <div class="card-full-image card-money-tree" onclick="handleBuy('金钱树', 10)"></div>

        <!-- ===================================== -->
        <!-- 卡片 2: 聚宝盆 (点击触发 100 USDT) -->
        <!-- ===================================== -->
        <div class="card-full-image card-baobao" onclick="handleBuy('聚宝盆', 100)"></div>

        <!-- ================================================ -->
        <!-- 卡片 3: 百宝箱 (改为全图卡片，点击触发 1000 USDT) -->
        <!-- ================================================ -->
        <div class="card-full-image card-baoxiang" onclick="handleBuy('百宝箱', 1000)"></div>

    </div>

    <!-- 购买记录 -->
    <div class="section-divider">
        <span class="section-title">购买记录</span>
    </div>
    <div class="record-list" id="recordList">
        <div class="record-item">
            <div class="record-info"><i class="fas fa-chevron-right"></i><div class="record-text"><h4>用户1 金钱树 10 USDT</h4><p>00:23:55 2026.06.02 14:30</p></div></div>
            <div class="record-price">购买 金钱树 10 USDT</div>
        </div>
        <div class="record-item">
            <div class="record-info"><i class="fas fa-chevron-right"></i><div class="record-text"><h4>用户2 购买 聚宝盆 100 USDT</h4><p>00:23:55 2026.06.01 12:15</p></div></div>
            <div class="record-price">购买 百宝箱 100 USDT</div>
        </div>
    </div>

    <script>
        function handleBuy(name, price) {
            alert(`💰 正在发起支付...\n商品：${name}\n金额：${price} USDT`);

            const list = document.getElementById('recordList');
            const item = document.createElement('div');
            item.className = 'record-item';
            const now = new Date();
            const time = now.toTimeString().split(' ')[0];
            const date = now.toLocaleDateString('zh-CN').replace(/\//g, '.');
            
            item.innerHTML = `
                <div class="record-info"><i class="fas fa-chevron-right"></i><div class="record-text"><h4>当前用户 购买 ${name} ${price} USDT</h4><p>${time} ${date}</p></div></div>
                <div class="record-price">购买 ${name} ${price} USDT</div>
            `;
            
            list.insertBefore(item, list.firstChild);
            if(list.children.length > 8) list.removeChild(list.lastChild);
        }
    </script>
</body>
</html>
