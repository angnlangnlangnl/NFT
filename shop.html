<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品选购 - 虚拟收益</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- 基础重置 --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background-image: url('images/产品选购背景.png');
            background-size: cover;
            background-position: top center; 
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
            padding: 20px 15px 130px; /* 增加底部内边距，为透明导航栏预留空间 */
            position: relative;
        }
        
        /* 顶部导航栏 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 500px;
            margin: 0 auto 10px;
            padding: 0 5px;
        }
        .header i { font-size: 24px; color: #e0d4ff; cursor: pointer; transition: 0.3s; }
        .header i:hover { color: #fff; }
        .header h1 {
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(180deg, #ffeeba 0%, #ffd700 50%, #e6b800 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            letter-spacing: 4px;
        }

        /* 副标题 */
        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #c8b6ff;
            margin-bottom: 30px;
            letter-spacing: 2px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }
        .subtitle::before, .subtitle::after {
            content: "";
            display: inline-block;
            width: 30px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #c8b6ff);
        }
        .subtitle::after { background: linear-gradient(270deg, transparent, #c8b6ff); }

        /* --- 商品卡片容器 --- */
        .product-container {
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
            z-index: 2;
        }

        /* ============================================
           纯图片卡片模板 (金钱树、聚宝盆、百宝箱 共用)
           ============================================ */
        .card-image-template {
            background: transparent; 
            border: none; 
            padding: 0; 
            box-shadow: none !important;
            min-height: 160px; 
            cursor: pointer; 
            overflow: hidden;
            border-radius: 16px;
            position: relative;
        }
        
        .card-image-template::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-size: contain; 
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 0;
            z-index: 0;
        }

        .card-image-template .product-icon,
        .card-image-template .product-info,
        .card-image-template .product-action {
            display: none; 
        }

        .card-money-tree::before { background-image: url('images/金钱树1.png'); }
        .card-bowl::before { background-image: url('images/聚宝盆1.png'); }
        .card-chest::before { background-image: url('images/百宝箱1.png'); }


        /* ============================================
           购买记录区域
           ============================================ */
        :root {
            --color-left-purple: #703cd8;
            --color-right-dark-purple: #30166b;
            --gold-text: #fff8d9;
            --light-text: #c8b8f0;
        }

        .section-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin: 45px 0 20px;
            max-width: 480px;
            margin-left: auto; margin-right: auto;
        }
        .section-divider i { color: #d4c4ff; font-size: 12px; }
        .section-title { font-size: 18px; font-weight: bold; color: #ffffff; }
        .section-divider::before, .section-divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, #d4c4ff, transparent);
        }

        .record-list {
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* ============================================
           统一记录卡片样式（参考新边框风格）
           ============================================ */
        .record-item-special {
            background: linear-gradient(90deg, var(--color-left-purple), var(--color-right-dark-purple));
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: 0.3s;
            box-shadow: inset 0 0 18px rgba(210, 170, 255, 0.12);
            
            border-radius: 12px;
            /* 【修改】参考财富使者卡片代码：使用 1px 半透明白色细边框 */
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .record-item-special:hover { 
            filter: brightness(1.1);
            /* 悬停时边框微微变亮 */
            border-color: rgba(255, 255, 255, 0.3);
        }

        /* --- 内部文字排版 --- */
        .record-info { display: flex; align-items: center; gap: 12px; }
        .record-info .fa-chevron-right { color: #d4c4ff; font-size: 10px; }
        .record-text h4 { 
            font-size: 13px; 
            font-weight: normal; 
            color: var(--gold-text);
        }
        
        .record-right {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            text-align: right;
        }
        
        .record-price {
            font-size: 12px;
            color: var(--gold-text);
            background: transparent; 
            border: none;
            padding: 0; 
        }
        
        .record-time-right {
            font-size: 10px;
            color: var(--light-text);
            margin-top: 2px;
        }

        /* ==================== 新增：统一底部透明导航栏样式 ==================== */
        .nav-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 110px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 10px 10px 20px 10px; 
            background: transparent;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            box-shadow: none;
            z-index: 999; 
            pointer-events: none; /* 关键：防止透明背景挡住下层点击，并将点击传给子元素 */
        }
        .nav-container .nav-item {
            pointer-events: auto; /* 恢复子元素可点击 */
        }

        .nav-item {
            position: relative;
            width: 68px;
            height: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #7448cc, #4a1d9b);
            border: 2px solid rgba(255, 215, 0, 0.4);
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.15), 0 0 20px rgba(112, 48, 210, 0.8);
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            clip-path: polygon(15% 0, 85% 0, 100% 15%, 100% 85%, 85% 100%, 15% 100%, 0 85%, 0 15%);
        }
        .nav-item.center {
            width: 84px;
            height: 98px;
            z-index: 2;
            border-color: rgba(255, 215, 0, 0.8);
            box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.2), 0 0 30px rgba(255, 215, 0, 0.3);
        }
        .nav-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.2);
        }
        .nav-item .icon-wrap {
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 4px;
        }
        .nav-item .icon-wrap svg {
            width: 32px;
            height: 32px;
            fill: #f9d976;
            filter: drop-shadow(0 0 5px rgba(255, 215, 0, 0.5));
        }
        .nav-item.center .icon-wrap svg {
            width: 40px;
            height: 40px;
        }
        .nav-item .label {
            font-size: 13px;
            font-weight: 500;
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255,255,255,0.2);
            letter-spacing: 1px;
        }
        .nav-item.center .label {
            font-size: 15px;
            font-weight: bold;
        }
        .nav-item::before {
            content: '';
            position: absolute;
            top: 2px;
            left: 15%;
            width: 70%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.8), transparent);
            border-radius: 50%;
            opacity: 0.6;
        }

        /* 移动端窄屏适配 */
        @media (max-width: 400px) {
            .nav-item { width: 56px; height: 68px; }
            .nav-item.center { width: 72px; height: 84px; }
            .nav-item .icon-wrap svg { width: 26px; height: 26px; }
            .nav-item.center .icon-wrap svg { width: 34px; height: 34px; }
            .nav-item .label { font-size: 11px; }
            .nav-container { gap: 8px; padding: 10px 5px 15px 5px; }
        }
        /* ==================== 导航栏样式结束 ==================== */
    </style>
</head>

    <script>
        function handleBuy(productName, price) {
            alert(`💰 正在发起支付...\n商品：${productName}\n金额：${price} USDT`);

            const now = new Date();
            const timeStr = now.toTimeString().split(' ')[0];
            const dateStr = now.toLocaleDateString('zh-CN').replace(/\//g, '.');

            const recordList = document.getElementById('recordList');
            
            const newItem = document.createElement('div');
            newItem.className = 'record-item-special';
            
            const randomSuffix = Math.random().toString(36).substring(2, 6).toUpperCase();
            
            newItem.innerHTML = `
                <div class="record-info">
                    <i class="fas fa-chevron-right"></i>
                    <div class="record-text">
                        <h4>0x${Math.floor(Math.random()*9999)}...${randomSuffix}</h4>
                    </div>
                </div>
                <div class="record-right">
                    <div class="record-price">购买 ${productName} ${price} USDT</div>
                    <div class="record-time-right">${timeStr} ${dateStr}</div>
                </div>
            `;

            recordList.insertBefore(newItem, recordList.firstChild);
            if (recordList.children.length > 8) {
                recordList.removeChild(recordList.lastChild);
            }
            newItem.style.animation = 'fadeSlideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
        }

        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes fadeSlideIn {
                from { opacity: 0; transform: translateY(-20px) scale(0.95); }
                to { opacity: 1; transform: translateY(0) scale(1); }
            }
        `;
        document.head.appendChild(style);
    </script>
