<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>产品选购 - 虚拟收益</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- 基础重置 --- */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            background-image: url('images/产品选购背景.png');
            background-size: cover;
            background-position: top center; 
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #ffffff;
            min-height: 100vh;
            padding: 20px 15px 50px;
            position: relative;
        }
        
        /* 顶部导航栏 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 500px;
            margin: 0 auto 10px;
            padding: 0 5px;
        }
        .header i { font-size: 24px; color: #e0d4ff; cursor: pointer; transition: 0.3s; }
        .header i:hover { color: #fff; }
        .header h1 {
            font-size: 32px;
            font-weight: 900;
            background: linear-gradient(180deg, #ffeeba 0%, #ffd700 50%, #e6b800 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            letter-spacing: 4px;
        }

        /* 副标题 */
        .subtitle {
            text-align: center;
            font-size: 13px;
            color: #c8b6ff;
            margin-bottom: 30px;
            letter-spacing: 2px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
        }
        .subtitle::before, .subtitle::after {
            content: "";
            display: inline-block;
            width: 30px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #c8b6ff);
        }
        .subtitle::after { background: linear-gradient(270deg, transparent, #c8b6ff); }

        /* --- 商品卡片容器 --- */
        .product-container {
            max-width: 480px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
            z-index: 2;
        }

        /* ============================================
           纯图片卡片模板 (金钱树、聚宝盆、百宝箱 共用)
           透明背景、无边框、点击整张卡片触发购买
           ============================================ */
        .card-image-template {
            background: transparent; 
            border: none; 
            padding: 0; 
            box-shadow: none !important;
            min-height: 160px; 
            cursor: pointer; 
            overflow: hidden;
            border-radius: 16px;
            position: relative;
        }
        
        /* 纯图片卡片背景图设置 */
        .card-image-template::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-size: contain; 
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 0;
            z-index: 0;
        }

        /* 强制隐藏卡片内的所有内容元素 */
        .card-image-template .product-icon,
        .card-image-template .product-info,
        .card-image-template .product-action {
            display: none; 
        }

        /* --- 金钱树 (使用金钱树1.png) --- */
        .card-money-tree::before {
            background-image: url('images/金钱树1.png');
        }

        /* --- 聚宝盆 (使用聚宝盆1.png) --- */
        .card-bowl::before {
            background-image: url('images/聚宝盆1.png');
        }

        /* --- 百宝箱 (使用百宝箱1.png) --- */
        .card-chest::before {
            background-image: url('images/百宝箱1.png');
        }
    </style>
</head>
<body>
    <header class="header">
        <i class="fas fa-chevron-left"></i>
        <h1>产品选购</h1>
        <i class="fas fa-times"></i>
    </header>

    <div class="subtitle">
        <span>选择财富道具，开启金币收益</span>
    </div>

    <!-- 商品主列表 -->
    <div class="product-container" id="productContainer">
        
        <!-- 卡片 1: 金钱树 (纯图卡片，点击触发 10 USDT) -->
        <div class="card-image-template card-money-tree" onclick="handleBuy('金钱树', 10)">
            <!-- 此处为空 -->
        </div>

        <!-- 卡片 2: 聚宝盆 (纯图卡片，点击触发 100 USDT) -->
        <div class="card-image-template card-bowl" onclick="handleBuy('聚宝盆', 100)">
            <!-- 此处为空 -->
        </div>

        <!-- 卡片 3: 百宝箱 (纯图卡片，点击触发 1000 USDT) -->
        <div class="card-image-template card-chest" onclick="handleBuy('百宝箱', 1000)">
            <!-- 此处为空 -->
        </div>
    </div>

    <!-- 购买记录区域 -->
    <div class="section-divider">
        <i class="fas fa-angle-double-left"></i>
        <span class="section-title">购买记录</span>
        <i class="fas fa-angle-double-right"></i>
    </div>

    <div class="record-list" id="recordList">
        <div class="record-item">
            <div class="record-info"><i class="fas fa-chevron-right"></i><div class="record-text"><h4>用户1 金钱树 10 USDT</h4><p>00:23:55 2026.06.02 14:30</p></div></div>
            <div class="record-price">购买 金钱树 10 USDT</div>
        </div>
        <div class="record-item">
            <div class="record-info"><i class="fas fa-chevron-right"></i><div class="record-text"><h4>用户2 购买 聚宝盆 100 USDT</h4><p>00:23:55 2026.06.01 12:15</p></div></div>
            <div class="record-price">购买 百宝箱 100 USDT</div>
        </div>
        <div class="record-item">
            <div class="record-info"><i class="fas fa-chevron-right"></i><div class="record-text"><h4>用户3 购买百宝箱 1000 USDT</h4><p>00:23:55 2026.06.01 10:45</p></div></div>
            <div class="record-price">购买 金钱树 100 USDT</div>
        </div>
        <div class="record-item">
            <div class="record-info"><i class="fas fa-chevron-right"></i><div class="record-text"><h4>用户4 购买百宝箱 1000 USDT</h4><p>00:23:55 2026.06.01 18:42</p></div></div>
            <div class="record-price">购买 金钱树 10 USDT</div>
        </div>
    </div>

    <script>
        function handleBuy(productName, price) {
            alert(`💰 正在发起支付...\n商品：${productName}\n金额：${price} USDT`);

            const now = new Date();
            const timeStr = now.toTimeString().split(' ')[0];
            const dateStr = now.toLocaleDateString('zh-CN').replace(/\//g, '.');

            const recordList = document.getElementById('recordList');
            const newItem = document.createElement('div');
            newItem.className = 'record-item';
            
            newItem.innerHTML = `
                <div class="record-info">
                    <i class="fas fa-chevron-right"></i>
                    <div class="record-text">
                        <h4>当前用户 购买 ${productName} ${price} USDT</h4>
                        <p>${timeStr} ${dateStr}</p>
                    </div>
                </div>
                <div class="record-price">购买 ${productName} ${price} USDT</div>
            `;

            recordList.insertBefore(newItem, recordList.firstChild);
            if (recordList.children.length > 8) {
                recordList.removeChild(recordList.lastChild);
            }
            newItem.style.animation = 'fadeSlideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
        }

        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes fadeSlideIn {
                from { opacity: 0; transform: translateY(-20px) scale(0.95); }
                to { opacity: 1; transform: translateY(0) scale(1); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
