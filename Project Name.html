<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>皇家虚拟钱庄</title>
    <style>
        /* 基础重置 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%;
            height: 100%;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            overflow: hidden; /* 防止滚动 */
            /* 【修改】不再使用金库背景图，改为深紫色纯色背景 */
            background-color: #0c031a; 
        }

        /* 容器居中 */
        .hero-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* 内容靠上对齐 */
        }

        /* ========================== */
        /* 按钮2 (图片按钮)  */
        /* ========================== */
        .btn2-wrapper {
            position: relative; 
            display: inline-block; 
            cursor: pointer;
            /* 【修改】将按钮整体向下移动 70 像素 */
            margin-top: 70px; 
            
            transition: transform 0.15s ease, filter 0.15s ease;
            z-index: 10;
        }

        .btn2-wrapper:hover {
            transform: scale(1.08);
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.7));
        }

        .btn2-wrapper:active {
            transform: scale(0.95);
        }

        /* 按钮图片本身 */
        .btn2-img {
            display: block;
            max-width: 80vw;    /* 最大宽度不超过屏幕的80% */
            max-height: 70px;   /* 控制一下图片按钮的高度 */
            height: auto;
            width: auto;
            object-fit: contain;
        }

        /* 适配手机屏幕 */
        @media (max-width: 600px) {
            .btn2-img { max-height: 50px; } /* 手机端限制高度 */
            .btn2-wrapper { margin-top: 50px; } /* 手机端可以稍微调小70px的距离 */
        }
    </style>
</head>
<body>

    <div class="hero-container">
        <!-- ================== -->
        <!-- 唯一的图片按钮 2 -->
        <!-- ================== -->
        <div class="btn2-wrapper" onclick="alert('您点击了按钮2！')">
            <img src="images/按钮2.png" alt="按钮2" class="btn2-img">
        </div>
    </div>

</body>
</html>
