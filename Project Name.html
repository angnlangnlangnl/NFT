<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>皇家虚拟钱庄 - 使者觉醒</title>
    <style>
        /* 基础重置 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%;
            height: 100%;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            overflow: hidden;
            background-color: #0c0f1e;
        }

        /* 1. 全屏背景图设置 */
        .hero-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-image: url('images/使者2.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 5%; 
        }

        /* 2. 图片按钮（沿用之前的优化尺寸） */
        .btn2-wrapper {
            display: inline-block; 
            cursor: pointer;
            transition: transform 0.15s ease, filter 0.15s ease;
            z-index: 10;
            margin-top: 96px; /* 保持现有间距 */
        }

        .btn2-wrapper:hover {
            transform: scale(1.08);
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.6));
        }

        .btn2-wrapper:active {
            transform: scale(0.95);
        }

        .btn2-img {
            display: block;
            max-width: 85vw;    
            max-height: 64px;   /* 保持高度 */
            height: auto;
            width: auto;
            object-fit: contain;
            /* 横向宽度依然是放大15%后的效果 */
            transform: scaleX(1.10); 
            image-rendering: auto; 
        }

        /* 适配手机屏幕 */
        @media (max-width: 600px) {
            .btn2-img { 
                max-height: 48px;          
                transform: scaleX(1.10);   
            }
            .btn2-wrapper { margin-top: 72px; }
        }
    </style>
</head>
<body>

    <div class="hero-container">
        
        <!-- ============================================= -->
        <!-- 点击按钮直接跳转到 shop.html -->
        <!-- ============================================= -->
        <div class="btn2-wrapper">
            <img src="images/按钮2.png" 
                 alt="立即解锁使者角色" 
                 class="btn2-img"
                 onclick="window.location.href='shop.html'">
        </div>

    </div>

</body>
</html>
