<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>皇家虚拟钱庄 - 使者觉醒</title>
    <style>
        /* 基础重置 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%;
            height: 100%;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            overflow: hidden;
            background-color: #0c0f1e;
        }

        /* 1. 全屏背景图设置 */
        .hero-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-image: url('images/使者2.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 5%; 
        }

        /* ================================ */
        /* 2. 拉长20%后的图片按钮 */
        /* ================================ */
        .btn2-wrapper {
            display: inline-block; 
            cursor: pointer;
            transition: transform 0.15s ease, filter 0.15s ease;
            z-index: 10;
            
            /* 间距保持 96px */
            margin-top: 96px; 
            
            /* 【关键修改】容器宽度拉长 20% */
            /* 数值越大按钮越宽，您可以自由调整这个宽度 */
            width: 120%; 
            max-width: 500px; /* 避免在大屏幕上拉得太长 */
            text-align: center; /* 让图片在容器内居中 */
        }

        .btn2-wrapper:hover {
            transform: scale(1.08);
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.6));
        }

        .btn2-wrapper:active {
            transform: scale(0.95);
        }

        /* 图片按钮本身 */
        .btn2-img {
            display: block;
            margin: 0 auto; /* 水平居中 */
            max-height: 64px;   /* 高度保持 64px 不变 */
            height: auto;
            
            /* 【重点】宽度拉长 20%，同时让浏览器等比缩放 */
            width: 120%; 
            object-fit: contain;
            /* 如果原图拉伸变形严重，保留 width: auto; 让它按比例撑满，但不等于120% */
            /* 这里我使用了 width: 120%; 来实现拉伸，如果变形太大，您可改为 width: 100%; */
        }

        /* 适配手机屏幕 */
        @media (max-width: 600px) {
            .btn2-img { max-height: 48px; } 
            .btn2-wrapper { 
                margin-top: 72px; 
                max-width: 350px; /* 手机上限制最大宽度 */
            }
        }
    </style>
</head>
<body>

    <div class="hero-container">
        
        <div class="btn2-wrapper" onclick="alert('使者角色已成功解锁！')">
            <img src="images/按钮2.png" alt="立即解锁使者角色" class="btn2-img">
        </div>

    </div>

</body>
</html>
