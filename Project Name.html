<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>皇家虚拟钱庄</title>
    <style>
        /* 基础重置 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%;
            height: 100%;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            overflow: hidden; /* 防止滚动 */
            background-color: #120a2e;
        }

        /* 1. 全屏背景图设置 */
        .hero-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-image: url('images/金库.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column; /* 垂直排列 */
            justify-content: flex-end; /* 整体靠下对齐 */
            align-items: center;
            padding-bottom: 8%; 
            transition: background-image 0.5s ease-in-out;
        }

        /* 为了让顶部按钮不受底部按钮和 padding 影响，我们将其绝对定位 */
        .top-btn-area {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            pointer-events: none; /* 让点击事件穿透，只触发内部按钮 */
        }

        /* ========================== */
        /* 2. 顶部紫色尖角按钮 (颜色优化版) */
        /* ========================== */
        .game-btn-wrapper {
            position: relative;
            display: inline-block;
            clip-path: polygon(
                10% 0, 90% 0, 
                100% 50%, 
                90% 100%, 10% 100%, 
                0% 50%
            );
            padding: 2px;
            background: linear-gradient(90deg, #b184f0, #fff9cc, #b184f0);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6), 0 0 40px rgba(180, 100, 255, 0.3);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            cursor: pointer;
            z-index: 10;
            
            /* 重点：向下移动的距离将由 JS 动态设置，此处默认为 0 */
            transform: translateY(0px);
            
            /* 保证即使不加载图片也有初始边距 */
            margin-top: 20px; 
            pointer-events: auto; /* 恢复按钮本身的点击 */
        }

        .game-btn-wrapper:hover {
            transform: scale(1.05) translateY(var(--move-distance, 0px)); /* 悬浮时保持移动距离 */
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.9), 0 0 60px rgba(180, 100, 255, 0.5);
        }
        .game-btn-wrapper:active {
            transform: scale(0.95) translateY(var(--move-distance, 0px)); /* 点击时保持移动距离 */
        }

        .game-btn {
            display: block;
            border: none;
            outline: none;
            padding: 12px 48px;
            color: #ffffff;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5), 0 2px 4px rgba(0,0,0,0.6);
            white-space: nowrap;
            background: linear-gradient(135deg, #9535eb 0%, #b44df5 40%, #7321bc 80%, #4a107b 100%);
            
            clip-path: polygon(
                10% 0, 90% 0, 
                100% 50%, 
                90% 100%, 10% 100%, 
                0% 50%
            );

            box-shadow: 
                inset 0 0 0 2px rgba(255, 255, 255, 0.7), 
                inset 0 8px 12px rgba(255, 255, 255, 0.5), 
                inset 0 -6px 10px rgba(0, 0, 0, 0.5);
                
            cursor: pointer;
        }


        /* ========================== */
        /* 3. 下方图片按钮2  */
        /* ========================== */
        .btn2-wrapper {
            position: relative; 
            display: inline-block; 
            cursor: pointer;
            transition: transform 0.15s ease, filter 0.15s ease;
            z-index: 10;
        }

        .btn2-wrapper:hover {
            transform: scale(1.08);
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.7));
        }

        .btn2-wrapper:active {
            transform: scale(0.95);
        }

        .btn2-img {
            display: block;
            max-width: 80vw;    
            max-height: 70px;   
            height: auto;
            width: auto;
            object-fit: contain;
        }


        /* 适配手机屏幕 */
        @media (max-width: 600px) {
            .game-btn { font-size: 16px; padding: 10px 30px; }
            .hero-container { padding-bottom: 15%; }
            .btn2-img { max-height: 50px; } 
        }
    </style>
</head>
<body>

    <div class="hero-container" id="mainContainer">
        
        <!-- ================== -->
        <!-- 顶部按钮区域容器 -->
        <!-- ================== -->
        <div class="top-btn-area" id="topBtnArea">
            <div class="game-btn-wrapper" id="gameBtnWrapper">
                <button class="game-btn" onclick="changeBackground()">
                    立即解锁管家角色
                </button>
            </div>
        </div>

        <!-- ================== -->
        <!-- 底部图片按钮 2 -->
        <!-- ================== -->
        <div class="btn2-wrapper" onclick="alert('您点击了按钮2！')">
            <img src="images/按钮2.png" alt="按钮2" class="btn2-img" id="btn2Img">
        </div>

    </div>

    <!-- JavaScript 交互与动态定位脚本 -->
    <script>
        // 1. 定义切换背景图的函数
        function changeBackground() {
            const container = document.getElementById('mainContainer');
            if (container.style.backgroundImage.includes('金库.png')) {
                container.style.backgroundImage = "url('images/使者2.png')";
            } else {
                container.style.backgroundImage = "url('images/金库.png')";
            }
        }

        // 2. 动态计算“向下移动一个按钮高度”
        window.onload = function() {
            // 获取图片按钮2的元素和顶部按钮的元素
            const btn2Img = document.getElementById('btn2Img');
            const gameBtnWrapper = document.getElementById('gameBtnWrapper');
            
            if (btn2Img && gameBtnWrapper) {
                // 获取图片按钮的渲染高度 (px)
                const btnHeight = btn2Img.offsetHeight;
                
                // 如果获取到了有效的数值
                if (btnHeight > 0) {
                    // 修改顶部按钮的 translateY 值，向下移动一个按钮高度
                    // 增加 10px 的额外间距让视觉不那么局促（可选）
                    gameBtnWrapper.style.transform = `translateY(${btnHeight + 10}px)`;
                    
                    // 将移动距离保存为 CSS 变量，以便 hover/active 状态时保持位置
                    gameBtnWrapper.style.setProperty('--move-distance', `${btnHeight + 10}px`);
                }
            }
        };

        // 如果浏览器窗口大小改变，重新计算高度（适配旋转屏幕）
        window.addEventListener('resize', function() {
            const btn2Img = document.getElementById('btn2Img');
            const gameBtnWrapper = document.getElementById('gameBtnWrapper');
            if (btn2Img && gameBtnWrapper) {
                const btnHeight = btn2Img.offsetHeight;
                if (btnHeight > 0) {
                    gameBtnWrapper.style.transform = `translateY(${btnHeight + 10}px)`;
                    gameBtnWrapper.style.setProperty('--move-distance', `${btnHeight + 10}px`);
                }
            }
        });
    </script>

</body>
</html>
