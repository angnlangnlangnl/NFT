<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>皇家虚拟钱庄 - 使者觉醒</title>
    <style>
        /* 基础重置 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%;
            height: 100%;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            overflow: hidden;
            background-color: #0c0f1e;
        }

        /* 1. 全屏背景图设置 */
        .hero-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-image: url('images/使者2.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 5%; 
        }

        /* ================================ */
        /* 2. 缩小后的图片按钮 */
        /* ================================ */
        .btn2-wrapper {
            display: inline-block; 
            cursor: pointer;
            transition: transform 0.15s ease, filter 0.15s ease;
            z-index: 10;
            
            /* 间距也跟着缩小，保持视觉上的下移比例 */
            margin-top: 80px; 
        }

        .btn2-wrapper:hover {
            transform: scale(1.08);
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.6));
        }

        .btn2-wrapper:active {
            transform: scale(0.95);
        }

        /* 图片按钮本身 - 缩小三分之一 */
        .btn2-img {
            display: block;
            max-width: 85vw;    
            max-height: 53px;   /* 【修改】原来80px，缩小1/3变为 53px */
            height: auto;
            width: auto;
            object-fit: contain;
        }

        /* 适配手机屏幕 */
        @media (max-width: 600px) {
            .btn2-img { max-height: 40px; } /* 手机端相应缩小 */
            .btn2-wrapper { margin-top: 60px; }
        }
    </style>
</head>
<body>

    <div class="hero-container">
        
        <div class="btn2-wrapper" onclick="alert('使者角色已成功解锁！')">
            <img src="images/按钮2.png" alt="立即解锁使者角色" class="btn2-img">
        </div>

    </div>

</body>
</html>
