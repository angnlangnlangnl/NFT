<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>皇家虚拟钱庄</title>
    <style>
        /* 基础重置 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%;
            height: 100%;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            overflow: hidden; /* 防止滚动 */
            background-color: #120a2e;
        }

        /* 1. 全屏背景图设置 */
        .hero-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            /* 加载指定的背景图片路径 */
            background-image: url('images/金库.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column; /* 改为垂直排列 */
            justify-content: flex-end; /* 整体靠下对齐 */
            align-items: center;
            padding-bottom: 8%; /* 调整整体离底部的距离 */
        }

        /* ========================== */
        /* 2. 原有的 紫色尖角按钮样式 */
        /* ========================== */
        .game-btn-wrapper {
            position: relative;
            display: inline-block;
            clip-path: polygon(
                10% 0, 90% 0, 
                100% 50%, 
                90% 100%, 10% 100%, 
                0% 50%
            );
            padding: 2px;
            background: linear-gradient(90deg, #9b6ed6, #fff6c2, #9b6ed6);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            cursor: pointer;
            z-index: 10;
            margin-bottom: 15px; /* 给下方按钮2留出空隙 */
        }

        .game-btn-wrapper:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
        }
        .game-btn-wrapper:active {
            transform: scale(0.95);
        }

        .game-btn {
            display: block;
            border: none;
            outline: none;
            padding: 12px 48px;
            color: #ffffff;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 0 1px 4px rgba(0,0,0,0.6);
            white-space: nowrap;
            background: linear-gradient(180deg, #8c3bd4 0%, #4e1085 100%);
            
            clip-path: polygon(
                10% 0, 90% 0, 
                100% 50%, 
                90% 100%, 10% 100%, 
                0% 50%
            );

            box-shadow: 
                inset 0 0 0 2px rgba(255, 255, 255, 0.5), 
                inset 0 6px 10px rgba(255, 255, 255, 0.3), 
                inset 0 -6px 10px rgba(0, 0, 0, 0.5);
        }


        /* ========================== */
        /* 3. 新增的【按钮2】图片样式  */
        /* ========================== */
        .btn2-wrapper {
            position: relative; /* 改为相对定位，自然排在下方 */
            display: inline-block; 
            cursor: pointer;
            transition: transform 0.15s ease, filter 0.15s ease;
            z-index: 10;
        }

        .btn2-wrapper:hover {
            transform: scale(1.08);
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.7));
        }

        .btn2-wrapper:active {
            transform: scale(0.95);
        }

        /* 按钮图片本身 */
        .btn2-img {
            display: block;
            max-width: 80vw;    /* 最大宽度不超过屏幕的80% */
            max-height: 70px;   /* 控制一下图片按钮的高度 */
            height: auto;
            width: auto;
            object-fit: contain;
        }


        /* 适配手机屏幕 */
        @media (max-width: 600px) {
            .game-btn { font-size: 16px; padding: 10px 30px; }
            .hero-container { padding-bottom: 15%; }
            .btn2-img { max-height: 50px; } /* 手机端限制高度 */
            .game-btn-wrapper { margin-bottom: 10px; }
        }
    </style>
</head>
<body>

    <div class="hero-container">
        
        <!-- ================== -->
        <!-- 原有的：紫色按钮  -->
        <!-- ================== -->
        <div class="game-btn-wrapper">
            <button class="game-btn" onclick="alert('正在为您解锁皇家金库管家角色！')">
                立即解锁管家角色
            </button>
        </div>

        <!-- ================== -->
        <!-- 新增的：图片按钮 2 -->
        <!-- ================== -->
        <div class="btn2-wrapper" onclick="alert('您点击了按钮2！')">
            <img src="images/按钮2.png" alt="按钮2" class="btn2-img">
        </div>

    </div>

</body>
</html>
