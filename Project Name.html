<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>皇家虚拟钱庄</title>
    <style>
        /* 基础重置 */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%;
            height: 100%;
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
            overflow: hidden; /* 防止滚动 */
            background-color: #120a2e;
        }

        /* 1. 全屏背景图设置 */
        .hero-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            /* 初始背景图：金库.png */
            background-image: url('images/金库.png'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column; /* 垂直排列 */
            justify-content: flex-end; /* 整体靠下对齐 */
            align-items: center;
            padding-bottom: 8%; /* 调整整体离底部的距离 */
            
            /* 增加背景图切换的淡入淡出过渡动画，体验更好 */
            transition: background-image 0.5s ease-in-out;
        }

        /* ========================== */
        /* 2. 顶部紫色尖角按钮 (颜色优化版) */
        /* ========================== */
        .game-btn-wrapper {
            position: relative;
            display: inline-block;
            clip-path: polygon(
                10% 0, 90% 0, 
                100% 50%, 
                90% 100%, 10% 100%, 
                0% 50%
            );
            padding: 2px;
            background: linear-gradient(90deg, #b184f0, #fff9cc, #b184f0);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6), 0 0 40px rgba(180, 100, 255, 0.3);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            cursor: pointer;
            z-index: 10;
            margin-bottom: 15px; 
        }

        .game-btn-wrapper:hover {
            transform: scale(1.05);
            box-shadow: 0 0 35px rgba(255, 215, 0, 0.9), 0 0 60px rgba(180, 100, 255, 0.5);
        }
        .game-btn-wrapper:active {
            transform: scale(0.95);
        }

        .game-btn {
            display: block;
            border: none;
            outline: none;
            padding: 12px 48px;
            color: #ffffff;
            font-size: 20px;
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5), 0 2px 4px rgba(0,0,0,0.6);
            white-space: nowrap;
            background: linear-gradient(135deg, #9535eb 0%, #b44df5 40%, #7321bc 80%, #4a107b 100%);
            
            clip-path: polygon(
                10% 0, 90% 0, 
                100% 50%, 
                90% 100%, 10% 100%, 
                0% 50%
            );

            box-shadow: 
                inset 0 0 0 2px rgba(255, 255, 255, 0.7), 
                inset 0 8px 12px rgba(255, 255, 255, 0.5), 
                inset 0 -6px 10px rgba(0, 0, 0, 0.5);
                
            /* 鼠标样式改为手型 */
            cursor: pointer;
        }


        /* ========================== */
        /* 3. 下方图片按钮2  */
        /* ========================== */
        .btn2-wrapper {
            position: relative; 
            display: inline-block; 
            cursor: pointer;
            transition: transform 0.15s ease, filter 0.15s ease;
            z-index: 10;
        }

        .btn2-wrapper:hover {
            transform: scale(1.08);
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.7));
        }

        .btn2-wrapper:active {
            transform: scale(0.95);
        }

        /* 按钮图片本身 */
        .btn2-img {
            display: block;
            max-width: 80vw;    
            max-height: 70px;   
            height: auto;
            width: auto;
            object-fit: contain;
        }


        /* 适配手机屏幕 */
        @media (max-width: 600px) {
            .game-btn { font-size: 16px; padding: 10px 30px; }
            .hero-container { padding-bottom: 15%; }
            .btn2-img { max-height: 50px; } 
            .game-btn-wrapper { margin-bottom: 10px; }
        }
    </style>
</head>
<body>

    <div class="hero-container" id="mainContainer">
        
        <!-- ================== -->
        <!-- 紫色按钮 (点击触发换图) -->
        <!-- ================== -->
        <div class="game-btn-wrapper">
            <!-- 添加 onclick 事件 -->
            <button class="game-btn" onclick="changeBackground()">
                立即解锁管家角色
            </button>
        </div>

        <!-- ================== -->
        <!-- 图片按钮 2 -->
        <!-- ================== -->
        <div class="btn2-wrapper" onclick="alert('您点击了按钮2！')">
            <img src="images/按钮2.png" alt="按钮2" class="btn2-img">
        </div>

    </div>

    <!-- JavaScript 交互脚本 -->
    <script>
        // 定义切换背景图的函数
        function changeBackground() {
            // 获取背景容器
            const container = document.getElementById('mainContainer');
            
            // 判断当前背景图路径，进行切换
            // 注意：图片路径必须是相对于 html 文件的绝对或相对路径
            if (container.style.backgroundImage.includes('金库.png')) {
                // 如果当前是金库，则切换为使者2
                container.style.backgroundImage = "url('images/使者2.png')";
                // 可选的：切换后弹出提示，表示解锁成功
                // alert('解锁成功！背景已切换。');
            } else {
                // 如果当前不是金库（比如已经是使者2了），则切换回金库
                container.style.backgroundImage = "url('images/金库.png')";
            }
        }
    </script>

</body>
</html>
